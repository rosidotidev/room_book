spring:
  application:
    name: roombook
  datasource:
    url: jdbc:sqlite:./data/roombook.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
roombook:
  zone: Europe/Rome
